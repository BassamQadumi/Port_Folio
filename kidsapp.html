<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Popup Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 30px;
    }

    .img-box {
      position: relative;
      width: 200px;
      height: 130px;
      cursor: pointer;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .img-text {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      font-size: 16px;
      padding: 5px 0;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    /* Popup overlay */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

<div class="gallery">
  <div class="img-box" onclick="showPopup('images/login.png')">
    <img src="images/login.png" alt="Image 1">
    <div class="img-text">Login Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/home.png')">
    <img src="images/home" alt="Image 2">
    <div class="img-text">Home Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/exploar')">
    <img src="images/exploar" alt="Image 3">
    <div class="img-text">Exploar Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/map_places.png')">
    <img src="images/map_places.png" alt="Image 4">
    <div class="img-text">Map_places Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/quiz_places.png')">
    <img src="images/quiz_places.png" alt="Image 4">
    <div class="img-text">Quiz_places Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/map_animals1.png')">
    <img src="images/map_animals1.png" alt="Image 4">
    <div class="img-text">Map_animals1 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/quiz_animals1.png')">
    <img src="images/quiz_animals1.png" alt="Image 4">
    <div class="img-text">Quiz_animals1 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/map_animals2.png')">
    <img src="images/map_animals2.png" alt="Image 4">
    <div class="img-text">map_animals2 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/quiz_animals2.png')">
    <img src="images/quiz_animals2.png" alt="Image 4">
    <div class="img-text">quiz_animals2 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/map_rocks.png')">
    <img src="images/map_rocks.png" alt="Image 4">
    <div class="img-text">Map_rocks Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/quiz_rocks.png')">
    <img src="images/quiz_rocks.png" alt="Image 4">
    <div class="img-text">Quiz_rocks Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/quiz.png')">
    <img src="images/quiz.png" alt="Image 4">
    <div class="img-text">Quiz Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/store1.png')">
    <img src="images/store1.png" alt="Image 4">
    <div class="img-text">Store1 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/store2.png')">
    <img src="images/store2.png" alt="Image 4">
    <div class="img-text">store2 Screen</div>
  </div>
  <div class="img-box" onclick="showPopup('images/profile.png')">
    <img src="images/profile.png" alt="Image 4">
    <div class="img-text">profile Screen</div>
  </div>
  
</div>

<!-- Popup overlay -->
<div class="popup" onclick="hidePopup()" id="popup">
  <img id="popupImage" src="" alt="Popup Image">
</div>

<script>
  function showPopup(src) {
    const popup = document.getElementById('popup');
    const popupImage = document.getElementById('popupImage');
    popupImage.src = src;
    popup.style.display = 'flex';
  }

  function hidePopup() {
    document.getElementById('popup').style.display = 'none';
  }
</script>

</body>
</html>
